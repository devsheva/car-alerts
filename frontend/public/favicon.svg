<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="carGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="alertGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Car body -->
  <path d="M6 18 L8 14 L10 12 L22 12 L24 14 L26 18 L26 22 L24 24 L8 24 L6 22 Z" 
        fill="url(#carGradient)" stroke="#6b21a8" stroke-width="0.5"/>
  
  <!-- Car windows -->
  <path d="M9 14 L11 12.5 L21 12.5 L23 14 L22 16 L10 16 Z" 
        fill="#e0e7ff" opacity="0.8"/>
  
  <!-- Car wheels -->
  <circle cx="10" cy="22" r="2.5" fill="#374151" stroke="#1f2937" stroke-width="0.5"/>
  <circle cx="22" cy="22" r="2.5" fill="#374151" stroke="#1f2937" stroke-width="0.5"/>
  <circle cx="10" cy="22" r="1.2" fill="#6b7280"/>
  <circle cx="22" cy="22" r="1.2" fill="#6b7280"/>
  
  <!-- Alert notification badge -->
  <circle cx="24" cy="8" r="4" fill="url(#alertGradient)" stroke="#dc2626" stroke-width="0.5"/>
  
  <!-- Exclamation mark in alert -->
  <path d="M24 5 L24 9 M24 10.5 L24 11" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
</svg>