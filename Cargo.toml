[package]
name = "car-alerts"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"

[dependencies]
axum = { version = "0.8.4", features = ["json"] }
chrono = { version = "0.4.39", features = ["serde"] }
hyper = "1.6.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
tokio = { version = "1.46.1", features = ["full"] }
tower = "0.5.2"

[dev-dependencies]
axum-test = "17.3.0"
